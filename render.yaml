# One-click DEMO deployment on Render (https://render.com/docs/blueprint-spec).
# Free web service + free Postgres (PostGIS is enabled by the first migration), Singapore region (closest to India).
#
# ⚠️ DEMO_MODE: OTPs are shown in the app instead of sent by SMS, so anyone can sign in as any number.
#    Use only with demo data. For real users: set OTP_PROVIDER=supabase + SUPABASE_URL/SUPABASE_SECRET_KEY
#    (DLT-registered SMS via MSG91), remove DEMO_MODE, and move off the free plans.
# Free-plan limits: the web service sleeps after ~15 min idle (first request then takes ~1 min), the free
# database expires after 30 days, and uploaded photos live on ephemeral disk (lost on redeploy).
databases:
  - name: mohalla-db
    plan: free
    region: singapore
    databaseName: mohalla
    user: mohalla

services:
  - type: web
    name: mohalla-connect-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mohalla-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: OTP_PROVIDER
        value: dev
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      # The mobile app doesn't use CORS; no browser client is allowed.
      - key: CORS_ORIGINS
        value: https://mohalla-connect.invalid
      - key: TRUST_PROXY
        value: "1"
      - key: GPS_CHECK_MIN_GAP_HOURS
        value: "0"
      - key: PUSH_ENABLED
        value: "false"
