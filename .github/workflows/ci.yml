name: CI

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API — typecheck + integration tests (PostGIS ${{ matrix.postgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgis: ["16-3.4", "17-3.5"]
    services:
      postgres:
        image: postgis/postgis:${{ matrix.postgis }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mohalla_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mohalla_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api
      - run: npm run build -w apps/api

  supabase-otp:
    name: API ↔ real Supabase Auth (GoTrue) OTP
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mohalla_it?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Start PostGIS
        run: |
          docker run -d --name pg --network host -e POSTGRES_PASSWORD=postgres postgis/postgis:17-3.5
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          sleep 3
          docker exec pg psql -U postgres -c 'CREATE DATABASE gotrue' -c 'CREATE DATABASE mohalla_it'
          docker exec pg psql -U postgres -d gotrue -c 'CREATE SCHEMA auth'
      - name: Start GoTrue
        run: |
          docker run -d --name gotrue --network host \
            -e GOTRUE_API_HOST=127.0.0.1 -e PORT=9999 -e API_EXTERNAL_URL=http://localhost:9999 \
            -e GOTRUE_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long \
            -e GOTRUE_DB_DRIVER=postgres -e DB_NAMESPACE=auth \
            -e "GOTRUE_DB_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gotrue?search_path=auth&sslmode=disable" \
            -e GOTRUE_EXTERNAL_PHONE_ENABLED=true -e GOTRUE_SMS_AUTOCONFIRM=true -e GOTRUE_SMS_MAX_FREQUENCY=5s \
            -e "GOTRUE_SMS_TEST_OTP=919900012345:123456,919900054321:654321" supabase/gotrue:v2.177.0
          for i in $(seq 1 60); do curl -sf http://localhost:9999/health && break; sleep 1; done
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run test:supabase -w apps/api
      - if: failure()
        run: docker logs gotrue | tail -50

  mobile:
    name: Mobile — typecheck + unit tests + expo-doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform web --output-dir dist

  e2e:
    name: End-to-end (Playwright, web build ↔ real API ↔ PostGIS)
    runs-on: ubuntu-latest
    needs: [api, mobile]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      CHROME_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm ci
        working-directory: apps/mobile
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: ./run-stack.sh
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e/screenshots
            e2e/test-results
